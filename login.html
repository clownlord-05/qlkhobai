<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Đăng nhập - Quản lý phế liệu</title>
<link rel="stylesheet" href="/login.css">
</head>
<body>
<form id="f" autocomplete="off">
 <h1>♻ Quản lý phế liệu</h1>
 <label>Tài khoản <input id="u" required autofocus maxlength="64" autocomplete="username"></label>
 <label>Mật khẩu <input id="p" type="password" required maxlength="256" autocomplete="current-password"></label>
 <div id="err"></div>
 <button id="b">Đăng nhập</button>
</form>
<script src="/login.js"></script>
</body>
</html>
